name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: go test ./internal/bpe
      - run: CGO_ENABLED=1 go build -o /tmp/openjevx ./cmd/openjevx
      - run: python -m py_compile scripts/*.py finetuning/*.py finetuning/*/*.py
      - run: bash -n finetuning/train/run_job.sh finetuning/gate/jevx13.sh
