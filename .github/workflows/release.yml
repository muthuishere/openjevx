name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ONNX Runtime CPU
        run: |
          curl -fsSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-linux-x64-1.29.0.tgz
          tar -xzf ort.tgz
          cp onnxruntime-linux-x64-1.29.0/lib/libonnxruntime.so .
      # zig is the C compiler so the binary needs only glibc 2.28 (Debian 10, RHEL 8), as scripts/package.sh does.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: go build -trimpath -ldflags "-s -w" -o openjevx ./cmd/openjevx
        env:
          CGO_ENABLED: "1"
          CC: zig cc -target x86_64-linux-gnu.2.28
      - run: tar --format ustar -cf openjevx-linux-amd64.tar README openjevx openjevx.json libonnxruntime.so LICENSE NOTICE CREDITS licenses
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: openjevx-linux-amd64.tar
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ONNX Runtime CPU
        run: |
          curl.exe -fsSL -o ort.zip https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-win-x64-1.29.0.zip
          tar -xf ort.zip
          cp onnxruntime-win-x64-1.29.0/lib/onnxruntime.dll .
      - run: go build -o openjevx.exe ./cmd/openjevx
        env:
          CGO_ENABLED: "1"
      - run: tar -a -cf openjevx-windows-amd64.zip README.cmd openjevx.exe openjevx.json onnxruntime.dll LICENSE NOTICE CREDITS licenses
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: openjevx-windows-amd64.zip
