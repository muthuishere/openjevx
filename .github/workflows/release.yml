name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { arch: amd64, ort: onnxruntime-linux-x64, zig: x86_64-linux-gnu.2.28 }
          - { arch: arm64, ort: onnxruntime-linux-aarch64, zig: aarch64-linux-gnu.2.28 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ONNX Runtime CPU
        run: |
          curl -fsSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/${{ matrix.ort }}-1.29.0.tgz
          tar -xzf ort.tgz
          cp -L ${{ matrix.ort }}-1.29.0/lib/libonnxruntime.so .
      # zig is the C compiler so the binary needs only glibc 2.28 (Debian 10, RHEL 8), as scripts/package.sh does;
      # it also cross-compiles arm64 on the amd64 runner.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: go build -trimpath -ldflags "-s -w" -o openjevx ./cmd/openjevx
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.arch }}
          CC: zig cc -target ${{ matrix.zig }}
      - run: file openjevx libonnxruntime.so
      # No openjevx.json: unpacking a new release over an old one must never replace the user's config (or ship a
      # password); without one the server listens on 127.0.0.1:21160 and generates its dashboard password.
      - run: tar --format ustar -cf openjevx-linux-${{ matrix.arch }}.tar README openjevx libonnxruntime.so LICENSE NOTICE CREDITS licenses
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: openjevx-linux-${{ matrix.arch }}.tar
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ONNX Runtime CPU
        run: |
          curl.exe -fsSL -o ort.zip https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-win-x64-1.29.0.zip
          tar -xf ort.zip
          cp onnxruntime-win-x64-1.29.0/lib/onnxruntime.dll .
      - run: go build -o openjevx.exe ./cmd/openjevx
        env:
          CGO_ENABLED: "1"
      - run: tar -a -cf openjevx-windows-amd64.zip README.cmd openjevx.exe onnxruntime.dll LICENSE NOTICE CREDITS licenses
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: openjevx-windows-amd64.zip

  # The server image for linux/amd64 and linux/arm64, built on native runners (no emulation) from the repo
  # Dockerfile and pushed to ghcr.io/deemwar-products/openjevx:<tag> and :latest. Only from a v* tag, and only when
  # the GHCR_DEEMWAR_PRODUCTS_TOKEN secret (write:packages on deemwar-products) is set; otherwise it says why it skipped.
  image-gate:
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.check.outputs.push }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.GHCR_DEEMWAR_PRODUCTS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=No image pushed::GHCR_DEEMWAR_PRODUCTS_TOKEN is not set: the owner must create a token with write:packages on deemwar-products and set it as this repo's secret."
            echo push=false >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::notice title=No image pushed::$GITHUB_REF is not a v* tag; run this workflow with --ref v<version>."
            echo push=false >> "$GITHUB_OUTPUT"
          else
            echo push=true >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: image-gate
    if: needs.image-gate.outputs.push == 'true'
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: deemwario
          password: ${{ secrets.GHCR_DEEMWAR_PRODUCTS_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=OpenJevX
            org.opencontainers.image.description=OpenJevX decision server with the 8-bit model
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/deemwar-products/openjevx,push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*

  image-push:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: deemwario
          password: ${{ secrets.GHCR_DEEMWAR_PRODUCTS_TOKEN }}
      - name: Tag both architectures as <tag> and latest, then inspect what was pushed
        run: |
          img=ghcr.io/deemwar-products/openjevx
          docker buildx imagetools create -t "$img:$GITHUB_REF_NAME" -t "$img:latest" \
            $(cd digests && printf "$img@sha256:%s " *)
          docker buildx imagetools inspect "$img:$GITHUB_REF_NAME" | tee inspect.txt
          digest=$(docker buildx imagetools inspect "$img:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)
          grep -q 'linux/amd64' inspect.txt && grep -q 'linux/arm64' inspect.txt
          test "$(docker buildx imagetools inspect "$img:latest" --format '{{json .Manifest}}' | jq -r .digest)" = "$digest"
          { echo "### Image"; echo; echo "\`$img:$GITHUB_REF_NAME\` (also \`:latest\`)"; echo; echo "digest \`$digest\`"; echo; echo '```'; cat inspect.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$img:$GITHUB_REF_NAME@$digest" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
