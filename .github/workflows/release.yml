name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { arch: amd64, ort: onnxruntime-linux-x64, zig: x86_64-linux-gnu.2.28 }
          - { arch: arm64, ort: onnxruntime-linux-aarch64, zig: aarch64-linux-gnu.2.28 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ONNX Runtime CPU
        run: |
          curl -fsSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/${{ matrix.ort }}-1.29.0.tgz
          tar -xzf ort.tgz
          cp -L ${{ matrix.ort }}-1.29.0/lib/libonnxruntime.so .
      # zig is the C compiler so the binary needs only glibc 2.28 (Debian 10, RHEL 8), as scripts/package.sh does;
      # it also cross-compiles arm64 on the amd64 runner.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: go build -trimpath -ldflags "-s -w" -o openjevx ./cmd/openjevx
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.arch }}
          CC: zig cc -target ${{ matrix.zig }}
      - run: file openjevx libonnxruntime.so
      # No openjevx.json: unpacking a new release over an old one must never replace the user's config (or ship a
      # password); without one the server listens on 127.0.0.1:21118 and generates its dashboard password.
      - run: tar --format ustar -cf openjevx-linux-${{ matrix.arch }}.tar README openjevx libonnxruntime.so LICENSE NOTICE CREDITS licenses
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: openjevx-linux-${{ matrix.arch }}.tar
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ONNX Runtime CPU
        run: |
          curl.exe -fsSL -o ort.zip https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-win-x64-1.29.0.zip
          tar -xf ort.zip
          cp onnxruntime-win-x64-1.29.0/lib/onnxruntime.dll .
      - run: go build -o openjevx.exe ./cmd/openjevx
        env:
          CGO_ENABLED: "1"
      - run: tar -a -cf openjevx-windows-amd64.zip README.cmd openjevx.exe onnxruntime.dll LICENSE NOTICE CREDITS licenses
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: openjevx-windows-amd64.zip
