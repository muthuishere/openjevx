name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ONNX Runtime CPU
        run: |
          curl -fsSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-linux-x64-1.29.0.tgz
          tar -xzf ort.tgz
          cp onnxruntime-linux-x64-1.29.0/lib/libonnxruntime.so .
      - run: CGO_ENABLED=1 go build -o openjevx ./cmd/openjevx
      - run: tar -czf openjevx-linux-amd64.tar.gz README openjevx openjevx.json libonnxruntime.so
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: openjevx-linux-amd64.tar.gz
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ONNX Runtime CPU
        run: |
          curl.exe -fsSL -o ort.zip https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-win-x64-1.29.0.zip
          tar -xf ort.zip
          cp onnxruntime-win-x64-1.29.0/lib/onnxruntime.dll .
      - run: go build -o openjevx.exe ./cmd/openjevx
        env:
          CGO_ENABLED: "1"
      - run: tar -a -cf openjevx-windows-amd64.zip README.cmd openjevx.exe openjevx.json onnxruntime.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: openjevx-windows-amd64.zip
