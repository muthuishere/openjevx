services:
  openjevx:
    image: ghcr.io/muthuishere/openjevx:latest
    build: .
    ports:
      - "127.0.0.1:21118:21118"
    # The dashboard password is required (no default); or mount your own config instead:
    environment:
      OPENJEVX_PASSWORD: ${OPENJEVX_PASSWORD:-}
    # volumes:
    #   - ./openjevx.docker.json:/app/openjevx.json:ro
    restart: unless-stopped
