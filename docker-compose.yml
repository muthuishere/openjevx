services:
  openjevx:
    image: ghcr.io/deemwar-products/openjevx:latest
    build: .
    ports:
      - "127.0.0.1:21118:21118"
    # Both credentials are required (no defaults); or mount your own config at /data/openjevx.json instead.
    # Clients send "Authorization: Bearer $OPENJEVX_API_KEY" to /v1/systemone.
    environment:
      OPENJEVX_PASSWORD: ${OPENJEVX_PASSWORD:-}
      OPENJEVX_API_KEY: ${OPENJEVX_API_KEY:-}
    # volumes:
    #   - ./openjevx.docker.json:/data/openjevx.json:ro
    restart: unless-stopped
