# "Deploy to DigitalOcean" button (App Platform): builds the repo's Dockerfile, which downloads the 8-bit model.
# The app URL is public, so both credentials are required secrets (the container refuses to start without them):
#   OPENJEVX_API_KEY   16+ characters (e.g. openssl rand -hex 24); clients send "Authorization: Bearer <key>"
#   OPENJEVX_PASSWORD  12+ characters; the dashboard, /stats and /metrics
spec:
  name: openjevx
  services:
    - name: openjevx
      dockerfile_path: Dockerfile
      git:
        repo_clone_url: https://github.com/muthuishere/openjevx.git
        branch: main
      http_port: 21160
      instance_size_slug: apps-s-1vcpu-2gb
      instance_count: 1
      envs:
        - key: OPENJEVX_API_KEY
          scope: RUN_TIME
          type: SECRET
          value: ""
        - key: OPENJEVX_PASSWORD
          scope: RUN_TIME
          type: SECRET
          value: ""
      health_check:
        http_path: /health
        initial_delay_seconds: 60
