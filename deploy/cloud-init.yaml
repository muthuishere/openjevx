#cloud-config
# OpenJevX 0.5.11 (model 0.5.2) on any Ubuntu/Debian VPS (AWS, Azure, GCP, DigitalOcean, Hetzner, ...): paste this as the
# instance's user data. Needs linux amd64 or arm64 and at least 2 GB RAM. Afterwards:
#   ssh in, cat /root/openjevx-password /root/openjevx-api-key, curl http://127.0.0.1:21160/health
# Generated by deploy/render.sh from deploy/VERSION and deploy/MODEL_VERSION: install.sh is pinned to a commit and checked by sha256.
package_update: true
packages: [curl, ca-certificates, ufw]
runcmd:
  - curl -fsSL https://raw.githubusercontent.com/muthuishere/openjevx/b428297a6e2b66d6c45e418081bab9e43dbf2862/deploy/install.sh -o /root/openjevx-install.sh
  - echo 'a0d880d28d2fc75a563d9cb727268554c3277e235e0773f2401d9138229a4956  /root/openjevx-install.sh' | sha256sum -c - && OPENJEVX_VERSION=0.5.11 OPENJEVX_MODEL_VERSION=0.5.2 bash /root/openjevx-install.sh
