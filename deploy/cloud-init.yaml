#cloud-config
# OpenJevX 0.5.8 (model 0.5.2) on any Ubuntu/Debian VPS (AWS, Azure, GCP, DigitalOcean, Hetzner, ...): paste this as the
# instance's user data. Needs linux amd64 or arm64 and at least 2 GB RAM. Afterwards:
#   ssh in, cat /root/openjevx-password /root/openjevx-api-key, curl http://127.0.0.1:21118/health
# Generated by deploy/render.sh from deploy/VERSION and deploy/MODEL_VERSION: install.sh is pinned to a commit and checked by sha256.
package_update: true
packages: [curl, ca-certificates, ufw]
runcmd:
  - curl -fsSL https://raw.githubusercontent.com/muthuishere/openjevx/805a9e80048d5a9b2750ffc82222f65da92a80eb/deploy/install.sh -o /root/openjevx-install.sh
  - echo '93fea3e614c0473398ad5ba3318ceea2ac96f745eff7e70d37b8dc2137937e0d  /root/openjevx-install.sh' | sha256sum -c - && OPENJEVX_VERSION=0.5.8 OPENJEVX_MODEL_VERSION=0.5.2 bash /root/openjevx-install.sh
