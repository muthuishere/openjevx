#cloud-config
# OpenJevX 0.5.0 on any Ubuntu/Debian VPS (AWS, Azure, GCP, DigitalOcean, Hetzner, ...): paste this as the
# instance's user data. Needs linux amd64 and at least 2 GB RAM. Afterwards:
#   ssh in, cat /root/openjevx-password, curl http://127.0.0.1:21118/health
# Generated by deploy/render.sh from deploy/VERSION: install.sh is pinned to a commit and checked by sha256.
package_update: true
packages: [curl, ca-certificates, ufw]
runcmd:
  - curl -fsSL https://raw.githubusercontent.com/muthuishere/openjevx/12fa73ced5e456236b80073c4eb25b9bad934f08/deploy/install.sh -o /root/openjevx-install.sh
  - echo '12918c7a2d7638a81453df086839038fd5439c67a8ecd43779d670023a6b37cf  /root/openjevx-install.sh' | sha256sum -c - && OPENJEVX_VERSION=0.5.0 bash /root/openjevx-install.sh
