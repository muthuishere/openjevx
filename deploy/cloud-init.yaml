#cloud-config
# OpenJevX 0.5.5 (model 0.5.2) on any Ubuntu/Debian VPS (AWS, Azure, GCP, DigitalOcean, Hetzner, ...): paste this as the
# instance's user data. Needs linux amd64 and at least 2 GB RAM. Afterwards:
#   ssh in, cat /root/openjevx-password, curl http://127.0.0.1:21118/health
# Generated by deploy/render.sh from deploy/VERSION and deploy/MODEL_VERSION: install.sh is pinned to a commit and checked by sha256.
package_update: true
packages: [curl, ca-certificates, ufw]
runcmd:
  - curl -fsSL https://raw.githubusercontent.com/muthuishere/openjevx/7cc4b2ccc2fbef27ff7672b45760686bf9392ef0/deploy/install.sh -o /root/openjevx-install.sh
  - echo 'a37a1db388633f0748155a23e48ba261231f70d36c8a1af14d559602d508482e  /root/openjevx-install.sh' | sha256sum -c - && OPENJEVX_VERSION=0.5.5 OPENJEVX_MODEL_VERSION=0.5.2 bash /root/openjevx-install.sh
