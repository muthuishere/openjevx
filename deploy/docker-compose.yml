# OpenJevX 0.5.11 (model 0.5.2) with Docker on any VPS, no clone needed: copy this one file, then
#   OPENJEVX_PASSWORD=<12+ characters> OPENJEVX_API_KEY=<16+ characters> docker compose up -d --build
# (the image downloads the 8-bit model while it builds). Clients send "Authorization: Bearer <key>". It listens
# on 127.0.0.1 only: reach it over an SSH tunnel, or open the port to your own network.
# Generated by deploy/render.sh from deploy/MODEL_VERSION (the server is built from source).
services:
  openjevx:
    build:
      context: https://github.com/muthuishere/openjevx.git#b428297a6e2b66d6c45e418081bab9e43dbf2862
    ports:
      - "127.0.0.1:21160:21160"
    environment:
      OPENJEVX_PASSWORD: ${OPENJEVX_PASSWORD:?set OPENJEVX_PASSWORD (12+ characters)}
      OPENJEVX_API_KEY: ${OPENJEVX_API_KEY:?set OPENJEVX_API_KEY (16+ characters)}
    restart: unless-stopped
