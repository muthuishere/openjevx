version: "3"

vars:
  ORT_VERSION: 1.22.0
  LOCAL: .local

tasks:
  setup:
    desc: Fetch the ONNX Runtime library and the 4-bit model into .local/
    cmds:
      - mkdir -p {{.LOCAL}}
      - |
        if [ ! -f {{.LOCAL}}/libonnxruntime.dylib ] && [ ! -f {{.LOCAL}}/libonnxruntime.so ]; then
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) pkg=onnxruntime-osx-arm64-{{.ORT_VERSION}}; lib=libonnxruntime.dylib ;;
            Darwin-x86_64) pkg=onnxruntime-osx-x86_64-{{.ORT_VERSION}}; lib=libonnxruntime.dylib ;;
            Linux-x86_64) pkg=onnxruntime-linux-x64-{{.ORT_VERSION}}; lib=libonnxruntime.so ;;
            Linux-aarch64) pkg=onnxruntime-linux-aarch64-{{.ORT_VERSION}}; lib=libonnxruntime.so ;;
            *) echo "unsupported platform"; exit 1 ;;
          esac
          curl -fsSL https://github.com/microsoft/onnxruntime/releases/download/v{{.ORT_VERSION}}/$pkg.tgz | tar -xz -C {{.LOCAL}}
          cp -L {{.LOCAL}}/$pkg/lib/$lib {{.LOCAL}}/$lib
          rm -rf {{.LOCAL}}/$pkg
        fi
      - |
        if [ ! -f {{.LOCAL}}/openjevx.w8.onnx ]; then
          curl -fsSL -o {{.LOCAL}}/openjevx.w8.onnx.zip https://github.com/muthuishere/openjevx/releases/download/v0.4.0/openjevx.w8.onnx.zip && unzip -p {{.LOCAL}}/openjevx.w8.onnx.zip openjevx.w8.onnx > {{.LOCAL}}/openjevx.w8.onnx && rm {{.LOCAL}}/openjevx.w8.onnx.zip
        fi

  build:
    desc: Build the server into .local/ next to the model and runtime
    deps: [setup]
    cmds:
      - CGO_ENABLED=1 go build -o {{.LOCAL}}/openjevx ./cmd/openjevx

  run:
    desc: Run the server locally (dashboard at http://127.0.0.1:21118/)
    deps: [build]
    cmds:
      - ./{{.LOCAL}}/openjevx

  test:
    desc: Run the Go tests
    cmds:
      - go test ./...

  package:
    desc: Build macOS, Linux and Windows release packages here (needs zig)
    cmds:
      - ./scripts/package.sh

  docker:
    desc: Build amd64 and arm64 images and save them as tars in .local/dist
    cmds:
      - mkdir -p {{.LOCAL}}/dist
      - docker build --platform linux/arm64 -t ghcr.io/muthuishere/openjevx:latest .
      - docker save ghcr.io/muthuishere/openjevx:latest -o {{.LOCAL}}/dist/openjevx-docker-arm64.tar
      - docker build --platform linux/amd64 -t ghcr.io/muthuishere/openjevx:latest-amd64 .
      - docker save ghcr.io/muthuishere/openjevx:latest-amd64 -o {{.LOCAL}}/dist/openjevx-docker-amd64.tar

  release:
    desc: "Publish .local/dist to a GitHub release (task release VERSION=v0.2.0)"
    requires: {vars: [VERSION]}
    cmds:
      - gh release view {{.VERSION}} >/dev/null 2>&1 || gh release create {{.VERSION}} --title "OpenJevX {{.VERSION}}" --notes "OpenJevX server {{.VERSION}}"
      - gh release upload {{.VERSION}} --clobber {{.LOCAL}}/dist/openjevx-*.tar {{.LOCAL}}/dist/openjevx-*.zip {{.LOCAL}}/dist/SHA256SUMS-server
