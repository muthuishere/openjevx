version: "3"

vars:
  ORT_VERSION: 1.29.0
  MODEL_VERSION: 0.5.2
  LOCAL: .local

tasks:
  setup:
    desc: Fetch the ONNX Runtime library and the model folder (.local/model/) into .local/
    cmds:
      - mkdir -p {{.LOCAL}}
      - |
        if [ ! -f {{.LOCAL}}/libonnxruntime.dylib ] && [ ! -f {{.LOCAL}}/libonnxruntime.so ]; then
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) pkg=onnxruntime-osx-arm64-{{.ORT_VERSION}}; lib=libonnxruntime.dylib ;;
            Linux-x86_64) pkg=onnxruntime-linux-x64-{{.ORT_VERSION}}; lib=libonnxruntime.so ;;
            Linux-aarch64) pkg=onnxruntime-linux-aarch64-{{.ORT_VERSION}}; lib=libonnxruntime.so ;;
            *) echo "unsupported platform"; exit 1 ;;
          esac
          curl -fsSL https://github.com/microsoft/onnxruntime/releases/download/v{{.ORT_VERSION}}/$pkg.tgz | tar -xz -C {{.LOCAL}}
          cp -L {{.LOCAL}}/$pkg/lib/$lib {{.LOCAL}}/$lib
          rm -rf {{.LOCAL}}/$pkg
        fi
      - |
        # The model is a folder (graph + config.json with its temperatures + tokenizer.json); the server
        # finds .local/model/ next to .local/openjevx. An old .local/openjevx.w8.onnx still works as a fallback.
        if [ ! -f {{.LOCAL}}/model/config.json ] && [ ! -f {{.LOCAL}}/openjevx.w8.onnx ]; then
          curl -fsSL https://github.com/muthuishere/openjevx/releases/download/v{{.MODEL_VERSION}}/openjevx-model-{{.MODEL_VERSION}}.tar.gz | tar -xz -C {{.LOCAL}}
        fi

  build:
    desc: Build the server into .local/ next to the model and runtime
    deps: [setup]
    cmds:
      - CGO_ENABLED=1 go build -o {{.LOCAL}}/openjevx ./cmd/openjevx

  run:
    desc: Run the server locally (dashboard at http://127.0.0.1:21160/)
    deps: [build]
    cmds:
      - ./{{.LOCAL}}/openjevx

  test:
    desc: Run the Go tests
    cmds:
      - go test ./...

  package:
    desc: Build macOS, Linux and Windows packages plus the model folder archive here (needs zig; MODEL_DIR=.local/model)
    cmds:
      - ./scripts/package.sh

  docker:
    desc: Build the arm64 and amd64 images locally (no image tars are released; users build with docker compose, ADR 0010)
    cmds:
      - docker build --platform linux/arm64 -t ghcr.io/deemwar-products/openjevx:latest .
      - docker build --platform linux/amd64 -t ghcr.io/deemwar-products/openjevx:latest-amd64 .

  book:
    desc: "Build the training book as markdown + PDF into dist/book/ (PUBLIC=1 for deemwar surfaces, source https://jev.deemwar.com/source)"
    cmds:
      - ./scripts/book.sh

  release:
    desc: "Publish .local/dist to a GitHub release (task release VERSION=v0.2.0)"
    requires: {vars: [VERSION]}
    cmds:
      - gh release view {{.VERSION}} >/dev/null 2>&1 || gh release create {{.VERSION}} --title "OpenJevX {{.VERSION}}" --notes "OpenJevX server {{.VERSION}}"
      # The release assets by name, never a glob over .local/dist: an old openjevx-docker-*.tar there must not ship.
      - >-
        gh release upload {{.VERSION}} --clobber
        {{.LOCAL}}/dist/openjevx-darwin-arm64.tar {{.LOCAL}}/dist/openjevx-linux-amd64.tar
        {{.LOCAL}}/dist/openjevx-linux-arm64.tar {{.LOCAL}}/dist/openjevx-windows-amd64.zip
        {{.LOCAL}}/dist/openjevx-model-*.tar.gz {{.LOCAL}}/dist/SHA256SUMS-server
